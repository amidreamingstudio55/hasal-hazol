name: Update prices

on:
  schedule:
    - cron: '17 4 * * *'   # every morning, ~06:17 Israel time
  workflow_dispatch:
  push:                    # a new version of the site, or prices fetched from Israel, go live right away
    branches: [main]
    paths: ['docs/**', 'scripts/**', 'data/local/**', '!docs/catalog.json']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and build the catalog
        run: python scripts/update_prices.py
      - name: Save the catalog in the repository
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/catalog.json
          git diff --cached --quiet || git commit -m "Prices $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
